name: Frontend Performance Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/performance-audit.yml"
      - "perf/**"
      - "scripts/perf-audit.mjs"
      - "quartz/components/**"
      - "quartz.config.ts"
      - "quartz.layout.ts"
      - "package.json"
      - "package-lock.json"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install and locate Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          CHROME_BIN="$(command -v chromium || command -v chromium-browser)"
          test -x "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Enforce production performance budgets
        run: npm run perf:check
        env:
          PERF_OUTPUT: perf-results.json
          PERF_PATHS: "/,/Dev/,/tags/Python.html"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-performance-audit
          path: perf-results.json
